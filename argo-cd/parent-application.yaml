apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: swellbeing-apps
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/chrisashwalker/swellbeing-gitops.git
    targetRevision: main
    path: argo-cd/apps

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      selfHeal: true