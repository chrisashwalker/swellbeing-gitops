apiVersion: batch/v1
kind: Job
metadata:
  name: swellbeing-db-migrate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never

      containers:
        - name: migrate
          image: chrisashwalker/swellbeing-api:latest
          command:
            - flask
            - --app
            - swellbeing_api.app:app
            - db
            - upgrade
