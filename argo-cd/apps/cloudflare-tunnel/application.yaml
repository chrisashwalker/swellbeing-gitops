apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudflare-tunnel
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/chrisashwalker/swellbeing-gitops.git
    targetRevision: main
    path: deployments/cloudflare-tunnel

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      selfHeal: true
      prune: true
